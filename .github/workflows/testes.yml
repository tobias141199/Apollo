# Roda os testes e o build público a cada push. Quem publica o site é o Railway (que lê a branch main).
name: Testes
on:
  push: { branches: [main] }
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build:public
